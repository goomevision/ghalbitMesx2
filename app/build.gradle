

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}


android {
    namespace 'com.ghalbitnet.meshx2'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghalbitnet.meshx2"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.1"
        def relayUrl = (project.findProperty("GHALBIT_RELAY_URL") ?: "").toString()
        def presenceUrl = (project.findProperty("GHALBIT_PRESENCE_URL") ?: relayUrl).toString()
        def routeMode = (project.findProperty("GHALBIT_ROUTE_MODE") ?: "AUTO_HYBRID").toString()
        buildConfigField "String", "BASE_RELAY_URL", "\"${relayUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "BASE_PRESENCE_URL", "\"${presenceUrl.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "boolean", "INTERNET_RELAY_CONFIGURED", relayUrl.isBlank() ? "false" : "true"
        buildConfigField "String", "GHALBIT_ROUTE_MODE", "\"${routeMode.replace("\\", "\\\\").replace("\"", "\\\"")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.14'
    implementation 'com.google.android.gms:play-services-nearby:18.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'  // encrypted prefs fallback
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    testImplementation 'junit:junit:4.13.2'
}
